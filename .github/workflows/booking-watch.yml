name: booking-watch

on:
  schedule:
    # Run approximately every 10 minutes.
    - cron: "4,14,24,34,44,54 * * * *"

  # Allows manual testing from GitHub Actions.
  workflow_dispatch: {}

# Allow the workflow to commit state.json back to the repository.
permissions:
  contents: write

concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run booking watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.84041b4ed4c6f4afd3b178a7522043d1 }}
          TELEGRAM_CHAT_ID: ${{ secrets.1769958597 }}
          SCRAPERAPI_KEY: ${{ secrets.84041b4ed4c6f4afd3b178a7522043d1 }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python poller.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "booking-watch-bot"
            git config user.email "actions@users.noreply.github.com"

            git add state.json
            git commit -m "chore: update booking-watch state [skip ci]"
            git push
          else
            echo "No state change."
          fi
